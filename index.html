<!doctype html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaultspace</title><link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body><div class="orb a"></div><div class="orb b"></div>
<header><a class="brand" href="#"><b>V</b> Vaultspace</a><div><span id="userEmail"></span> <button id="logout" class="ghost hidden">Log out</button></div></header>
<main>
<section id="auth"><div class="intro"><small>YOUR DIGITAL SPACE</small><h1>Keep your work.<br><i>Own your space.</i></h1><p>Notes, files and private rooms in one real cloud workspace.</p></div>
<div class="card authcard"><div class="tabs"><button data-mode="login" class="active">Log in</button><button data-mode="signup">Create account</button></div>
<form id="authForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><button class="primary" type="submit" id="authSubmit">Log in ↗</button></form><p id="authMsg"></p></div></section>
<section id="app" class="hidden"><div class="heading"><div><small>WORKSPACE</small><h2>Your Vaultspace</h2></div><button id="newNote" class="primary">+ New note</button></div>
<div class="stats"><div class="card"><b id="notesCount">0</b><small>Notes</small></div><div class="card"><b id="filesCount">0</b><small>Files</small></div><div class="card"><b id="roomsCount">0</b><small>Rooms</small></div></div>
<div class="grid">
<section class="card panel"><div class="panelhead"><h3>Notes</h3><button id="refresh">↻</button></div>
<form id="noteForm" class="hidden"><input id="noteTitle" placeholder="Title" required><textarea id="noteContent" placeholder="Write something..." required></textarea><button class="primary">Save note</button> <button type="button" id="cancel" class="ghost">Cancel</button></form><div id="notes"></div></section>
<section class="card panel"><div class="panelhead"><h3>Files</h3><label class="upload">Upload<input id="file" type="file" hidden></label></div><div id="files"></div></section>
<section class="card panel full"><div class="panelhead"><h3>Shared rooms</h3><button id="newRoom" class="primary">+ Room</button></div><form id="roomForm" class="hidden"><input id="roomName" placeholder="Room name" required><button class="primary">Create</button></form><div id="rooms"></div></section>
</div></section></main><div id="toast"></div><script src="script.js"></script></body></html>
